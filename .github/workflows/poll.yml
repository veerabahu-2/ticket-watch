name: Poll tickets

on:
  schedule:
    - cron: "3/7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync state
        run: scripts/sync-state.sh

      - name: Poll District
        run: node src/poll.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUIRE_NTFY: "true"
          REQUIRE_TELEGRAM: "true"

      - name: Commit state
        run: |
          git config user.name "ticket-watch-bot"
          git config user.email "ticket-watch-bot@users.noreply.github.com"
          scripts/sync-state.sh --push "chore: update state [skip ci]"
